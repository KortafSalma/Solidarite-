<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration du registre des dons">
  <!-- Solidarité+ : illustration propre au prototype (pas une photographie) -->
  <rect width="800" height="600" fill="#ECE9E4"/>
  <circle cx="640" cy="130" r="150" fill="#171717"/>
  <rect x="0" y="470" width="800" height="130" fill="#BE2034"/>

  <!-- Caisse ouverte -->
  <g stroke="#171717" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="#F5F4F1">
    <path d="M170 320 L380 290 L560 330 L560 470 L380 500 L170 460 Z"/>
    <path d="M170 320 L340 300 L520 340 L560 330"/>
    <path d="M340 300 L340 480"/>
  </g>

  <!-- Contenu qui dépasse : cahier, tricot plié -->
  <g stroke="#171717" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="360" y="230" width="150" height="100" fill="#F5F4F1" transform="rotate(-8 435 280)"/>
    <line x1="385" y1="255" x2="500" y2="238" fill="none"/>
    <line x1="390" y1="285" x2="505" y2="268" fill="none"/>
    <path d="M240 250 q30 -40 60 0 q30 -35 60 0 l-10 45 l-110 0 Z" fill="#F5F4F1"/>
  </g>

  <!-- Étiquette rouge -->
  <g transform="rotate(12 250 210)">
    <rect x="215" y="180" width="110" height="64" rx="6" fill="#BE2034"/>
    <circle cx="238" cy="212" r="7" fill="#F5F4F1"/>
    <text x="255" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="bold" fill="#F9F6F2">0 DH</text>
  </g>

  <!-- Regard documentaire : filet et numéro -->
  <text x="60" y="90" font-family="Georgia, serif" font-size="46" fill="#171717">N° 001</text>
  <line x1="60" y1="108" x2="220" y2="108" stroke="#171717" stroke-width="4"/>

  <!-- Texte sur bande rouge -->
  <text x="60" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="bold" fill="#F9F6F2">Un objet utile. Une aide concrète.</text>
</svg>
